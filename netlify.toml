[build]
  command = "npm install --legacy-peer-deps && npm run clean"
  publish = "dist" 
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 8888
  functionsPort = 9999

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20.16.0" 
